[project]
name = "devops_crewai_project"
version = "0.1.0"
description = "devops-crewai-project using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.130.0,<1.0.0"
]


[project.scripts]
run_crew = "devops_crewai_project.main:run"

[tool.uv.scripts]
run_crew = "devops_crewai_project.main:run"


train = "devops_crewai_project.main:train"
replay = "devops_crewai_project.main:replay"
test = "devops_crewai_project.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
